name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With two tags on one commit (v0.1.0 and v0.1.0-rc.2), goreleaser released the wrong one.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  install:
    needs: goreleaser
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh install.sh -b "$RUNNER_TEMP/bin" "$GITHUB_REF_NAME"
      - run: |
          version=$("$RUNNER_TEMP/bin/bidirekt" version)
          echo "$version"
          test "$version" = "bidirekt version ${GITHUB_REF_NAME#v}"

  image:
    needs: goreleaser
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          version=$(docker run --rm "ghcr.io/bidirekt/cli:${GITHUB_REF_NAME#v}" version)
          echo "$version"
          test "$version" = "bidirekt version ${GITHUB_REF_NAME#v}"
      - run: |
          version=$(docker run --rm --entrypoint sh "ghcr.io/bidirekt/cli:${GITHUB_REF_NAME#v}" -c 'bidirekt version')
          echo "$version"
          test "$version" = "bidirekt version ${GITHUB_REF_NAME#v}"
