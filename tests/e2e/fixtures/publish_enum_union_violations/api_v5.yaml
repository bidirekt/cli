provides:
  rest:
    "/orders/*":
      get:
        responses:
          "200": Order

schemas:
  Order:
    type: object
    properties:
      status:
        type: enum
        members: [placed, paid, shipped]
      payment:
        type: union
        members: {}

  CardPayment:
    type: object
    properties:
      number:
        type: string

  PixPayment:
    type: object
    properties:
      key:
        type: string
