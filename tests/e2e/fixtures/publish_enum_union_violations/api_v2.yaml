provides:
  rest:
    "/orders/*":
      get:
        responses:
          "200": Order

schemas:
  Order:
    type: object
    properties:
      status:
        type: enum
      payment:
        type: union
        members:
          card:
            ref: CardPayment
          pix:
            ref: PixPayment

  CardPayment:
    type: object
    properties:
      number:
        type: string

  PixPayment:
    type: object
    properties:
      key:
        type: string
