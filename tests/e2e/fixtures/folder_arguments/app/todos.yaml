consumes:
  ${API}:
    rest:
      "/todos":
        get:
          responses:
            "200": Todos
      "/todos/*":
        get:
          responses:
            "200": Todo

schemas:
  Todo:
    type: object
    properties:
      todoId:
        type: integer
      title:
        type: string

  Todos:
    type: array
    items:
      ref: Todo
