schemas:
  Todo:
    type: object
    properties:
      todoId:
        type: integer
      title:
        type: string
      tags:
        type: array
        items:
          type: string

  Todos:
    type: array
    items:
      ref: Todo

  CreateTodoRequest:
    type: object
    properties:
      title:
        type: string

  UpdateTodoRequest:
    type: object
    properties:
      title:
        type: string
      completed:
        type: boolean

  Message:
    type: object
    properties:
      message:
        type: string
