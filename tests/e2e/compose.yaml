services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 3s
      retries: 15

  broker:
    image: ghcr.io/bidirekt/broker:0.2.0
    environment:
      BIDIREKT_DATABASE_URL: postgres://broker:broker@postgres:5432/broker?sslmode=disable
      BIDIREKT_PUBLIC_URL: http://localhost:8080
      BIDIREKT_TOKEN_SIGNING_KEY: ZTJlLW9ubHktdG9rZW4tc2lnbmluZy1rZXktMzJieXQ=
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
